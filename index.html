<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6ecb8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Challenges">
  <title>Challenges</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="home" class="screen">
    <h1 class="title">Challenges</h1>
    <div class="grid">
      <button id="open-pullups" class="tile">
        <span class="tile-name">Pull-ups</span>
        <span id="tile-week" class="tile-meta">Week 1</span>
      </button>
    </div>
  </main>

  <main id="pullups" class="screen" hidden>
    <button id="back" class="back">‹ Back</button>
    <h1 class="title">Pull-ups</h1>

    <nav id="weeks" class="weeks" aria-label="Week"></nav>

    <section class="plan">
      <div class="plan-head">
        <span id="week-name" class="week-name">Week 1</span>
        <span id="week-total" class="week-total">Total 23</span>
      </div>
      <ol id="sets" class="sets"></ol>
    </section>

    <section class="actions">
      <button id="next" class="primary">Done clean · next week</button>
      <button id="repeat" class="secondary">Repeat this week</button>
    </section>

    <section class="log">
      <h2>Workouts</h2>
      <ul id="log"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
